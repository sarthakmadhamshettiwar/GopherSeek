<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GopherSeek — Geo Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.5px; }
    header span { font-size: 0.85rem; opacity: 0.6; margin-left: 4px; }

    .container { max-width: 720px; margin: 40px auto; padding: 0 16px; }

    #location-banner {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    #location-banner.hidden { display: none; }
    #location-banner.error { background: #f8d7da; border-color: #f5c6cb; }
    #location-banner button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .search-box {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .search-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .search-row input:disabled { background: #f0f0f0; cursor: not-allowed; }
    .search-row button {
      padding: 10px 20px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .search-row button:disabled { background: #aaa; cursor: not-allowed; }

    .options-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .options-row label { font-size: 0.8rem; color: #555; }
    .options-row input[type="number"] {
      width: 90px;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      align-items: center;
    }
    .controls span { font-size: 0.85rem; color: #666; margin-right: 4px; }
    .sort-btn {
      padding: 6px 14px;
      border: 1px solid #ccc;
      border-radius: 20px;
      background: #fff;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.15s;
    }
    .sort-btn.active {
      background: #1a1a2e;
      color: #fff;
      border-color: #1a1a2e;
    }

    #status {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 12px;
      min-height: 20px;
    }

    .results { display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 16px;
      align-items: start;
    }
    .card-name { font-weight: 600; font-size: 1rem; grid-column: 1; }
    .card-dist {
      font-size: 0.82rem;
      font-weight: 600;
      color: #1a1a2e;
      background: #e8e8f4;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
      grid-column: 2;
      grid-row: 1 / 3;
      align-self: center;
    }
    .card-text { font-size: 0.88rem; color: #555; grid-column: 1; margin-top: 2px; }
    .card-score { font-size: 0.75rem; color: #999; grid-column: 1; margin-top: 4px; }

    .no-results {
      text-align: center;
      color: #888;
      padding: 40px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <h1>GopherSeek</h1>
  <span>geo-aware full-text search</span>
</header>

<div class="container">

  <!-- TODO: uncomment once corpus covers user's real location (currently Delhi-only). -->
  <!--
  <div id="location-banner">
    <strong>Location access required</strong><br>
    GopherSeek uses your location to surface nearby results. Click below to allow access.
    <br>
    <button onclick="requestLocation()">Allow Location</button>
  </div>
  -->

  <div class="search-box">
    <div class="search-row">
      <input id="query-input" type="text" placeholder="e.g. peaceful and less crowded" />
      <button id="search-btn" onclick="doSearch()">Search</button>
    </div>
    <div class="options-row">
      <label>
        Radius (km):
        <input id="radius-input" type="number" min="0" step="10" placeholder="any" />
      </label>
      <label>
        Top K:
        <input id="topk-input" type="number" min="1" max="50" value="10" />
      </label>
    </div>
  </div>

  <div class="controls">
    <span>Sort by:</span>
    <button class="sort-btn active" id="btn-relevancy" onclick="setSortBy('relevancy')">Relevancy</button>
    <button class="sort-btn" id="btn-distance" onclick="setSortBy('distance')">Distance</button>
  </div>

  <div id="status"></div>
  <div id="results" class="results"></div>

</div>

<script>
  // TODO: revert to null and re-enable browser geolocation once corpus covers the user's real location.
  let userLat = 28.5895;
  let userLong = 77.2465;
  let sortBy = 'relevancy';
  let lastResults = [];

  /*
  function requestLocation() {
    userLat = 28.5895;
    userLong = 77.2465;
    hideBanner();
    document.getElementById('query-input').disabled = false;
    document.getElementById('search-btn').disabled = false;
    document.getElementById('query-input').focus();
  }

  function showBanner(msg, isError) {
    const b = document.getElementById('location-banner');
    b.innerHTML = msg;
    b.className = isError ? 'error' : '';
  }

  function hideBanner() {
    document.getElementById('location-banner').className = 'hidden';
  }
  */

  function setSortBy(val) {
    sortBy = val;
    document.getElementById('btn-relevancy').className = 'sort-btn' + (val === 'relevancy' ? ' active' : '');
    document.getElementById('btn-distance').className = 'sort-btn' + (val === 'distance' ? ' active' : '');
    renderResults(lastResults);
  }

  async function doSearch() {
    const query = document.getElementById('query-input').value.trim();
    if (!query) return;

    const radius = document.getElementById('radius-input').value;
    const topK = document.getElementById('topk-input').value || 10;

    const params = new URLSearchParams({
      query,
      lat: userLat,
      long: userLong,
      k: topK,
      sort: sortBy,
    });
    if (radius) params.set('radius', radius);

    setStatus('Searching…');
    document.getElementById('results').innerHTML = '';

    try {
      const resp = await fetch(`/search?${params}`);
      if (!resp.ok) {
        const text = await resp.text();
        setStatus(`Error: ${text}`);
        return;
      }
      const data = await resp.json();
      lastResults = data || [];
      renderResults(lastResults);
      setStatus(lastResults.length === 0 ? 'No results found.' : `${lastResults.length} result(s)`);
    } catch (e) {
      setStatus(`Request failed: ${e.message}`);
    }
  }

  function renderResults(results) {
    const sorted = [...results].sort((a, b) =>
      sortBy === 'distance' ? a.distanceKm - b.distanceKm : b.bm25Score - a.bm25Score
    );

    const container = document.getElementById('results');
    if (sorted.length === 0) {
      container.innerHTML = '<div class="no-results">No results found for this query and location.</div>';
      return;
    }

    container.innerHTML = sorted.map(r => `
      <div class="card">
        <div class="card-name">${escHtml(r.name)}</div>
        <div class="card-dist">${r.distanceKm.toFixed(1)} km</div>
        <div class="card-text">${escHtml(r.text)}</div>
        <div class="card-score">BM25: ${r.bm25Score.toFixed(4)}</div>
      </div>
    `).join('');
  }

  function setStatus(msg) {
    document.getElementById('status').textContent = msg;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  window.addEventListener('load', () => {
    // TODO: uncomment once corpus covers user's real location (currently Delhi-only).
    /*
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          userLat = pos.coords.latitude;
          userLong = pos.coords.longitude;
          hideBanner();
          document.getElementById('query-input').disabled = false;
          document.getElementById('search-btn').disabled = false;
        },
        () => {} // user will click the button
      );
    }
    */
    document.getElementById('query-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });
  });
</script>
</body>
</html>
